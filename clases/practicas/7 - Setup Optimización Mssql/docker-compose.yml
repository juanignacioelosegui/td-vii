services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2017-CU20-ubuntu-16.04
    container_name: td7_mssql_server_db
    ports:
      - "1437:1433"
    environment:
      SA_PASSWORD: "ExamplePassword1"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    volumes:
      - ./mssql_data:/var/opt/mssql
    restart: always